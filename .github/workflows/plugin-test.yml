name: Zhenxun Integration Test

on:
  workflow_dispatch:
    inputs:
      zhenxun-repository:
        description: Zhenxun host repository
        default: zhenxun-org/zhenxun_bot
        type: string
      zhenxun-ref:
        description: Host branch or commit (empty uses its default branch)
        default: ""
        type: string
  push:
    branches: [ "stable", "dev" ]
    paths:
      - ".github/actions/setup-python/**"
      - ".github/workflows/plugin-test.yml"
      - "src/zhenxun_plugin_mystool/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "requirements.txt"
  pull_request:
    branches: [ "stable", "dev" ]
    paths:
      - ".github/actions/setup-python/**"
      - ".github/workflows/plugin-test.yml"
      - "src/zhenxun_plugin_mystool/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "requirements.txt"

jobs:
  plugin_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    name: zhenxun plugin test
    permissions:
      contents: read
    env:
      ZHENXUN_ROOT: ${{ github.workspace }}/.host/zhenxun_bot
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Zhenxun host
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.zhenxun-repository || 'zhenxun-org/zhenxun_bot' }}
          ref: ${{ inputs.zhenxun-ref || '' }}
          path: .host/zhenxun_bot
      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host dependencies
        run: poetry run pip install -e .host/zhenxun_bot
      - name: Test Plugin
        run: |
          poetry run python -m pytest tests/test_zhenxun_integration.py tests/test_configuration.py tests/test_storage.py -q
