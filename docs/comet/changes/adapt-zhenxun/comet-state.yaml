acceptance:
  - id: A1
    source: brief.md
    text: The plugin loads in the target zhenxun environment without SAA or the QQ
      official adapter, and its metadata is available to zhenxun plugin
      management and help generation.
    result: passed
    reason:
      text: 独立核对新包初始化、PluginExtraData与宿主模型自动注册。隔离fixture拦截QQ适配器导入并加载实际宿主服务；本轮integration通过插件加载、metadata及管理配置测试，不依赖SAA或QQ官方适配器。
      truncated: false
  - id: A2
    source: brief.md
    text: Interactive replies and proactive notifications preserve text and image
      content, respect the selected OneBot bot/adapter, and report delivery
      failure without claiming success.
    result: passed
    reason:
      text: common.send_private_msg使用MessageUtils与PlatformUtils，明确Bot/Adapter选择，失败/无回执/无可用Bot返回失败。绑定integration覆盖OneBot文字、图片导出、选择及日志；真实Bot送达未运行。
      truncated: false
  - id: A3
    source: brief.md
    text: Commands use the configured non-empty prefix (default 米游社); help examples
      match the registered commands, and unprefixed zhenxun commands remain
      usable.
    result: passed
    reason:
      text: 命令和metadata统一使用非空配置前缀，空值回退米游社；帮助/验证码/好友欢迎语使用COMMAND_BEGIN。绑定测试验证前缀匹配与宿主未加前缀命令不被吞掉，以及custom配置往返。
      truncated: false
  - id: A4
    source: brief.md
    text: Each configurable setting is separately registered through PluginExtraData
      RegisterConfig entries and round-trips through the host config generation
      and reload with its correct type, help and default. No old grouped
      dictionaries, configV2.json or access-list text files are read or written.
    result: passed
    reason:
      text: configuration/keys与registry按全部Preference及图片字段分别产生RegisterConfig并注入PluginExtraData.configs，每项具有value/default/help/parser。测试经宿主生成config.yaml及reload验证类型、中文键和名单，并拒绝非法时间等值；旧字典与JSON/名单文本路径已移除。
      truncated: false
  - id: A5
    source: brief.md
    text: Users, accounts, cookies, bindings, exchange plans and per-user settings
      are durably stored in the host database. Fresh initialization and restart
      restore data; transaction failures roll back and concurrency preserves
      independent updates. No business JSON files are created or used.
    result: passed
    reason:
      text: storage拆分ORM模型、codec、repository、session，使用真寻Model默认连接和in_transaction，不创建私有连接。事务内读取/差异合并/版本协调，外部请求在事务外；失败重置会话并回滚。绑定测试实际临时SQLite验证账号Cookies/用户UUID/绑定/计划/设置往返、关闭连接重读、独立并发合并与冲突拒绝、Task所有权隔离及回滚。命令保存await后报告成功，对话保留ID重新读取，账户删除事务内移除计划。
      truncated: false
  - id: A6
    source: brief.md
    text: Scheduled sign-in, coin tasks and note reminders retain their timing and
      notification switches; focused checks do not contact production accounts.
    result: passed
    reason:
      text: daily_schedule和auto_note_check保留cron/interval设置与通知开关，均包装隔离会话等待DB就绪；宿主DB优先级1、storage2、恢复3顺序由源与测试验证。exchange_jobs重启恢复、旧计划执行前重验，scheduler监督异步结果处理，末线程提交后通知。绑定测试覆盖恢复/删除计划/提交失败不通知，未联系真实账号。
      truncated: false
  - id: A7
    source: brief.md
    text: The user's README remains byte-for-byte unchanged. Code/configuration help
      and formal change documents explain storage/config behavior and
      verification limits; dependencies permit the target environment. QQ
      official support and its commands are absent from runtime, metadata and
      dependency declarations. requirements.txt installs qrcode and ntplib in
      the host venv.
    result: passed
    reason:
      text: 本轮fresh-storage-readme校验用户README
        SHA256与约定一致，git状态README未修改；正式brief/spec解释数据库与配置及验证边界。dependency-scope/wheel-layout/lock/package均通过，QQ官方imports/声明/命令删除，requirements包含与项目匹配qrcode/ntplib约束。
      truncated: false
