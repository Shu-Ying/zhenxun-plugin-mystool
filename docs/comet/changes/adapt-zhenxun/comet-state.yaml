  - id: A1
    source: brief.md
    text: The plugin loads in the target zhenxun environment without SAA, and its
      metadata is available to zhenxun plugin management and help generation.
    result: passed
    reason:
      text: 当前 __init__.py 注册真寻 PluginExtraData 和配置；轻量 require 入口隔离加载，无 SAA；真实宿主
        _handle_config 和 _handle_setting 已由本轮 Runtime integration 14 passed 覆盖。
      truncated: false
  - id: A2
    source: brief.md
    text: Interactive replies and proactive notifications preserve text and image
      content, respect the selected bot/adapter and QQ guild context, and report
      delivery failure without claiming success.
    result: passed
    reason:
      text: common.py:353-414 保留 bool/exception 返回合同；OneBot 使用 PlatformUtils，QQ 使用真寻构造
        UniMessage 和显式 source guild Target；空回执、缺 Bot 和异常均失败。测试覆盖文本图片、QQ 实际
        exporter/模拟 API、指定 Adapter 及子模块失败日志落盘。
      truncated: false
  - id: A3
    source: brief.md
    text: Commands use the configured non-empty prefix (default 米游社); help examples
      match the registered commands, and unprefixed zhenxun commands remain
      usable.
    result: passed
    reason:
      text: 配置在命令加载前解析，空前缀规范为米游社，已有自定义前缀保留；命令 Rule 检查排除裸签到/帮助/设置；plan.py 验证码提示现使用
        COMMAND_BEGIN，README 示例一致。相关 Runtime integration 检查通过。
      truncated: false
  - id: A4
    source: brief.md
    text: Explicit zhenxun configuration takes precedence over legacy configV2.json;
      absent fields migrate from legacy configuration, then use defaults.
      Existing account data, cookies, bindings and exchange plans remain
      readable.
    result: passed
    reason:
      text: 独立读取 zhenxun_config.py:13-103 和宿主生成流程：arg_parser
        合并规范基线与显式稀疏值，_generate_simple_config 调用解析后写入 YAML，reload
        再保存。test_sparse_yaml_migration_survives_host_generation 覆盖真实宿主生成、重载、旧
        JSON 编辑/删除，plan_time 仍 03:45 且 timeout
        31。账户/Cookies/绑定/兑换计划往返兼容测试通过，源数据模型差异仅 pydantic.v1 import。
      truncated: false
  - id: A5
    source: brief.md
    text: Scheduled sign-in, coin tasks and note reminders retain their timing and
      notification switches; focused checks do not contact production accounts.
    result: passed
    reason:
      text: 当前计划任务声明及用户通知/自动任务开关相对基线未改；每日 cron 使用迁移后的 plan_time，便笺 interval 使用
        resin_interval。Runtime 隔离测试检查 daily_schedule 和 resin_check，未启动真实签到兑换。
      truncated: false
  - id: A6
    source: brief.md
    text: Documentation explains installation, command/configuration changes and
      verification limits; dependencies permit the target environment.
    result: passed
    reason:
      text: README 说明本地安装、require 入口、真寻目录限制、QQ 驱动、配置优先级和重启/验证边界；pyproject 不再声明
        SAA，Pydantic 2 通过 v1 兼容层。当前候选 Runtime syntax/lock/package exit
        0，integration 14 passed；已核对正式日志。
      truncated: false
