[tool.poetry]
name = "zhenxun-plugin-mystool"
version = "v2.10.3"
description = "真寻机器人米游社插件 | 每日米游币任务、游戏签到、商品兑换、免抓包登录、原神崩铁便笺提醒"
license = "MIT"
authors = [
  "Ljzd-PRO <me@ljzd.link>",
  "Everything0519 <598139245@qq.com>"
]
readme = "README.md"
homepage = "https://github.com/Shu-Ying/zhenxun-plugin-mystool"
repository = "https://github.com/Shu-Ying/zhenxun-plugin-mystool"
documentation = "https://github.com/Shu-Ying/zhenxun-plugin-mystool#readme"
keywords = ["bot", "qq", "qqbot", "onebotv11", "onebot", "nonebot2", "nonebot", "mihoyo", "mihoyobbs", "star-rail", "genshin-impact"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable"
]
packages = [
    { include = "zhenxun_plugin_mystool", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
httpx = ">=0.24.1,<0.29.0"
nonebot_plugin_apscheduler = ">=0.2.0"
nonebot-plugin-alconna = ">=0.56.0"
ntplib = "^0.4.0"
Pillow = ">=9.5,<12.0"
requests = "^2.31.0"
nonebot-adapter-onebot = "^2.3.1"
tenacity = ">=8.2.3,<10.0.0"
qrcode = ">=7.4.2,<9.0.0"
pydantic = ">=2.0,<3.0"
nonebot2 = ">=2.3.3"
pytz = ">=2023.4,<2025.0"

[tool.poetry.group.test.dependencies]
flake8 = ">=6.1,<8.0"
pytest = ">=8,<9"

[tool.poetry.group.test]
optional = true

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/Shu-Ying/zhenxun-plugin-mystool/issues"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
